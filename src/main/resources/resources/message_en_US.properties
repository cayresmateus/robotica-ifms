sobre.titulo=About the Robotics Laboratory
sobre.subtitulo=Institutional space for teaching, applied research, outreach, and technological innovation.
sobre.historia.titulo=Our History & Mission
sobre.historia.texto=The Robotics Laboratory at IFMS Campo Grande was created to provide students with hands-on experience in automation, microcontroller programming, electronics, and artificial intelligence. Through research projects (such as Negr\u00f3tica and PICTEC grants), curricular internships, and community workshops, it bridges academic knowledge with community challenges.
