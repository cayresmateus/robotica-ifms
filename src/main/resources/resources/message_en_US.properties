sobre.missao.titulo=Laboratory Mission
sobre.missao.texto=To provide a hands-on, collaborative learning environment for technical and undergraduate students, merging theory and practice in educational robotics, automation, and embedded systems.
sobre.visao.titulo=Vision for the Future
sobre.visao.texto=To be a regional and national benchmark in training skilled technical professionals, delivering impactful technological solutions and excelling in scientific competitions.
sobre.ensino.titulo=Education
sobre.ensino.desc=Integration with regular coursework and teaching projects that reinforce core technical foundations.
sobre.pesquisa.titulo=Research
sobre.pesquisa.desc=Development of inventions, control algorithms, prototypes, and competitive grant proposals.
sobre.extensao.titulo=Outreach
sobre.extensao.desc=Initiatives dedicated to the local community, hands-on workshops in public schools, and digital inclusion.

