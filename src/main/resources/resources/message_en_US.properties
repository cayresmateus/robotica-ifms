sobre.pilar1.titulo=Research & Innovation
sobre.pilar1.desc=Development of autonomous robots, line followers, embedded systems, and social technologies.
sobre.pilar2.titulo=Community Outreach
sobre.pilar2.desc=Conducting hands-on Arduino and logic workshops for public schools and continuing education.
sobre.pilar3.titulo=Competitions & Achievements
sobre.pilar3.desc=Preparation and participation in OBR (Brazilian Robotics Olympiad) and science fairs.
