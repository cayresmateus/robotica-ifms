sobre.titulo=Sobre o Laborat\u00f3rio de Rob\u00f3tica
sobre.subtitulo=Espa\u00e7o institucional de ensino, pesquisa aplicada, extens\u00e3o e inova\u00e7\u00e3o tecnol\u00f3gica.
sobre.historia.titulo=Nossa Hist\u00f3ria & Miss\u00e3o
sobre.historia.texto=O Laborat\u00f3rio de Rob\u00f3tica do IFMS Campus Campo Grande nasceu com a miss\u00e3o de proporcionar aos estudantes viv\u00eancias pr\u00e1ticas em automa\u00e7\u00e3o, programa\u00e7\u00e3o de microcontroladores, eletr\u00f4nica e intelig\u00eancia artificial. Por meio de projetos de pesquisa (como o Negr\u00f3tica e editais PICTEC), est\u00e1gios curriculares e oficinas comunit\u00e1rias, o espa\u00e7o conecta o conhecimento acad\u00eamico aos desafios sociais da comunidade.
sobre.pilares.titulo=\u00c1reas de Atua\u00e7\u00e3o
sobre.pilar1.titulo=Pesquisa & Inova\u00e7\u00e3o
sobre.pilar1.desc=Desenvolvimento de rob\u00f4s aut\u00f4nomos, seguidores de linha, sistemas embarcados e tecnologias sociais.
sobre.pilar2.titulo=Extens\u00e3o Comunit\u00e1ria
sobre.pilar2.desc=Realiza\u00e7\u00e3o de oficinas pr\u00e1ticas de Arduino e l\u00f3gica para escolas p\u00fablicas e forma\u00e7\u00e3o continuada.
sobre.pilar3.titulo=Competi\u00e7\u00f5es & Conquistas
sobre.pilar3.desc=Prepara\u00e7\u00e3o e participa\u00e7\u00e3o na OBR (Olimp\u00edada Brasileira de Rob\u00f3tica) e mostras cient\u00edficas.
