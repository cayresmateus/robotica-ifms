sobre.missao.titulo=Miss\u00e3o do Laborat\u00f3rio
sobre.missao.texto=Proporcionar um ambiente pr\u00e1tico e colaborativo para estudantes dos cursos t\u00e9cnicos e superiores, unindo teoria e pr\u00e1tica atrav\u00e9s do desenvolvimento de projetos de rob\u00f3tica pedag\u00f3gica, automa\u00e7\u00e3o e sistemas embarcados.
sobre.visao.titulo=Vis\u00e3o de Futuro
sobre.visao.texto=Ser refer\u00eancia regional e nacional na forma\u00e7\u00e3o de profissionais capacitados, gerando solu\u00e7\u00f5es tecnol\u00f3gicas com impacto social direto na comunidade e forte participa\u00e7\u00e3o em competi\u00e7\u00f5es cient\u00edficas.
sobre.ensino.titulo=Ensino
sobre.ensino.desc=Integra\u00e7\u00e3o com disciplinas regulares e projetos de ensino que aprofundam o aprendizado t\u00e9cnico.
sobre.pesquisa.titulo=Pesquisa
sobre.pesquisa.desc=Desenvolvimento de inova\u00e7\u00f5es, algoritmos de controle, prot\u00f3tipos e participa\u00e7\u00e3o em editais de fomento.
sobre.extensao.titulo=Extens\u00e3o
sobre.extensao.desc=A\u00e7\u00f5es voltadas \u00e0 comunidade externa, oficinas em escolas p\u00fablicas e difus\u00e3o tecnol\u00f3gica.

