sobre.titulo=Acerca del Laboratorio de Rob\u00f3tica
sobre.subtitulo=Espacio institucional de ense\u00f1anza, investigaci\u00f3n aplicada, extensi\u00f3n e innovaci\u00f3n tecnol\u00f3gica.
sobre.historia.titulo=Nuestra Historia y Misi\u00f3n
sobre.historia.texto=El Laboratorio de Rob\u00f3tica del IFMS Campus Campo Grande naci\u00f3 con la misi\u00f3n de brindar a los estudiantes experiencias pr\u00e1cticas en automatizaci\u00f3n, programaci\u00f3n de microcontroladores, electr\u00f3nica e inteligencia artificial. A trav\u00e9s de proyectos de investigaci\u00f3n (como Negr\u00f3tica y convocatorias PICTEC), pasant\u00edas y talleres comunitarios, conecta el conocimiento acad\u00e9mico con las necesidades sociales.
sobre.pilares.titulo=\u00c1reas de Acci\u00f3n
sobre.pilar1.titulo=Investigaci\u00f3n e Innovaci\u00f3n
sobre.pilar1.desc=Desarrollo de robots aut\u00f3nomos, seguidores de l\u00ednea, sistemas embebidos y tecnolog\u00edas sociales.
sobre.pilar2.titulo=Extensi\u00f3n Comunitaria
sobre.pilar2.desc=Realizaci\u00f3n de talleres pr\u00e1cticos de Arduino y l\u00f3gica para escuelas p\u00fablicas y formaci\u00f3n continua.
sobre.pilar3.titulo=Competencias y Logros
sobre.pilar3.desc=Preparaci\u00f3n y participaci\u00f3n en la OBR (Olimpiada Brasile\u00f1a de Rob\u00f3tica) y ferias cient\u00edficas.
