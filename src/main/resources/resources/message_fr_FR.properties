sobre.missao.titulo=Mission du Laboratoire
sobre.missao.texto=Fournir un environnement d'apprentissage pratique et collaboratif pour les \u00e9tudiants techniques et universitaires, alliant th\u00e9orie et pratique en robotique p\u00e9dagogique, automatisation et syst\u00e8mes embarqu\u00e9s.
sobre.visao.titulo=Vision d'Avenir
sobre.visao.texto=\u00catre une r\u00e9f\u00e9rence r\u00e9gionale et nationale dans la formation de professionnels qualifi\u00e9s, apportant des solutions technologiques \u00e0 fort impact communautaire.
sobre.ensino.titulo=Enseignement
sobre.ensino.desc=Int\u00e9gration aux cours r\u00e9guliers et projets d'enseignement renfor\u00e7ant les comp\u00e9tences techniques.
sobre.pesquisa.titulo=Recherche
sobre.pesquisa.desc=D\u00e9veloppement d'inventions, d'algorithmes de contr\u00f4le, de prototypes et soumission de projets de recherche.
sobre.extensao.titulo=Vulgarisation
sobre.extensao.desc=Initiatives tourn\u00e9es vers la communaut\u00e9 externe, ateliers dans les \u00e9coles publiques et inclusion num\u00e9rique.

