sobre.titulo=\u00c0 propos du Laboratoire de Robotique
sobre.subtitulo=Espace institutionnel d'enseignement, de recherche appliqu\u00e9e, de vulgarisation et d'innovation.
sobre.historia.titulo=Notre Histoire & Mission
sobre.historia.texto=Le Laboratoire de Robotique de l'IFMS Campus Campo Grande a \u00e9t\u00e9 cr\u00e9\u00e9 dans le but de fournir aux \u00e9tudiants une exp\u00e9rience pratique en automatisation, programmation de microcontr\u00f4leurs, \u00e9lectronique et intelligence artificielle. \u00c0 travers des projets de recherche (comme Negr\u00f3tica et les bourses PICTEC), des stages et des ateliers communautaires, il relie les connaissances acad\u00e9miques aux d\u00e9fis r\u00e9els.
